</style></head><body><header><h1>ТД ХОЛДИНГ · Санитарный контроль</h1><small>ОП Тольятти · автономная версия 5.1 · управленческая отчётность</small></header><div class="wrap"><nav class="noprint"><button onclick="home()">Проверки</button><button onclick="history()">История</button><button onclick="dashboard()">Дашборд</button><button onclick="settings()">Резервная копия</button></nav><main id="app"></main></div><script id="dataset" type="application/json">[{"name": "цех производства пельменей", "criteria": [{"n": "1", "text": "Температура в производственном помещении (соответствует / не соответствует)"}, {"n": "2", "text": "Весы (настольные / напольные), используемые в текущей деятельности, чистые, в рабочем состоянии."}, {"n": "3", "text": "Рукомойники в исправном состоянии, горячая и холодная вода есть, моющее и дезинфицирующее средство для мойки рук в диспенсерах есть. Инструкция по мойке рук рядом с раковинами в наличии."}, {"n": "4", "text": "Графики санитарной обработки помещений в наличии. Имеются подписи ответственных лиц. Проверяется эффективность санитарной обработки. На рабочих местах имеются актуальные инструкции по санитарной обработке."}, {"n": "5", "text": "В помещении нет посторонних запахов. На полу, стенах, потолке отсутствуют следы ржавчины, плесени, облупления краски, щели."}, {"n": "6", "text": "Трапы чистые, не засорены."}, {"n": "7", "text": "Определено место для хранения уборочного инвентаря. Инвентарь промаркирован."}, {"n": "8", "text": "Оборудование в чистом состоянии, на оборудовании отсутствуют следы технологических жидкостей:\n- загрузочный бункер, \n- транспортёрная линия, \n- тестомесильный аппарат, \n- линия по производству пельменей, \n- пульт управления, \n- дозирующее устройство для муки"}, {"n": "9", "text": "Сырьё/отходы не размещаются на полу - хранение только на поддонах."}, {"n": "10", "text": "Проверяется чистота инсектицидных ламп, журнал в наличии. Записи в журнале актуальны."}, {"n": "11", "text": "Закрыты все ворота и двери (внешние и внутренние), кроме использующихся в данный момент. "}, {"n": "12", "text": "К стенам есть свободный доступ для уборки."}, {"n": "13", "text": "Организованы места временного хранения мусора. Емкости для мусора идентифицированы."}, {"n": "14", "text": "Исправность и наполнение гигрометров психрометрических."}, {"n": "15", "text": "Отсутствуют насекомые, птицы, грызуны и следы их жизнедеятельности."}, {"n": "16", "text": "Стеллажи/столы чистые, на поверхности отсутствуют посторонние предметы."}], "scale": "Возможные баллы: 0 - требование не реализуется; 1 - требование реализуется нерегулярно/ частично; 2 - требование реализуется постоянно и систематически"}, {"name": "цех производства ФИЛО", "criteria": [{"n": "1", "text": "Температура в производственном помещении (соответствует / не соответствует)"}, {"n": "2", "text": "Весы (настольные / напольные), используемые в текущей деятельности, чистые, в рабочем состоянии."}, {"n": "3", "text": "Рукомойник в исправном состоянии, горячая и холодная вода есть, моющее и дезинфицирующее  средство для мойки рук в диспенсерах есть. Инструкция по мойке рук рядом с раковинами в наличии."}, {"n": "4", "text": "Графики санитарной обработки помещений в наличии. Имеются подписи ответственных лиц. Проверяется эффективность санитарной обработки. На рабочих местах имеются актуальные инструкции по санитарной обработке."}, {"n": "5", "text": "В помещении нет посторонних запахов. На полу, стенах, потолке отсутствуют следы ржавчины, плесени, облупления краски, щели."}, {"n": "6", "text": "Трапы чистые, не засорены."}, {"n": "7", "text": "Определено место для хранения уборочного инвентаря. Инвентарь промаркирован. "}, {"n": "8", "text": "Оборудование в чистом состоянии, на оборудовании отсутствуют следы технологических жидкостей:\n- транспортёрная линия, \n- пульт управления,\n-тестоделитель,                                                                                                                                            -  "3", "text": "Весы (настольные / напольные), используемые в текущей деятельности, чистые, в рабочем состоянии."}, {"n": "4", "text": "Рукомойники в исправном состоянии, горячая и холодная вода есть, МДС для мойки рук в диспенсерах есть. Инструкция по мойке рук рядом с раковинами в наличии."}, {"n": "5", "text": "Графики санитарной обработки помещений в наличии. Имеются подписи ответственных лиц. Проверяется эффективность санитарной обработки. На рабочих местах имеются актуальные инструкции по санитарной обработке."}, {"n": "6", "text": "В помещении нет посторонних запахов. На полу, стенах, потолке отсутствуют следы ржавчины, плесени, облупления краски, щели."}, {"n": "7", "text": "Трапы чистые, не засорены."}, {"n": "8", "text": "Определено место для хранения уборочного инвентаря. Инвентарь промаркирован."}, {"n": "9", "text": "Поддоны, используемые для текущей деятельности, чистые/целые."}, {"n": "10", "text": "Оборудование в чистом состоянии, на оборудовании отсутствуют следы технологических жидкостей, пыли, грязи, специй, сырья:\n- куттер, \n- волчок, \n- фаршемешалка, \n- блокорезка."}, {"n": "11", "text": "Проверяется чистота инсектицидных ламп, журнал в наличии. Записи в журнале актуальны."}, {"n": "12", "text": "Закрыты все ворота и двери (внешние и внутренние), кроме использующихся в данный момент. "}, {"n": "13", "text": "К стенам есть свободный доступ для уборки."}, {"n": "14", "text": "Отсутствуют насекомые, птицы, грызуны и следы их жизнедеятельности."}, {"n": "15", "text": "Организованы места временного хранения мусора. Емкости для мусора идентифицированы."}, {"n": "16", "text": "Ёмкости с сырьём закрыты."}, {"n": "17", "text": "Стеллажи/столы чистые, на поверхности отсутствуют посторонние предметы."}], "scale": "Возможные баллы:    0 - требование не реализуется      1 - требование реализуется нерегулярно/ частично\n2 - требование реализуется постоянно и систематически"}, {"name": "территория", "criteria": [{"n": "1", "text": "Соблюдение санитарных правил:\n-соблюдение личной гигиены, требований к спецодежде, отсутствие личных вещей работников (часы, наушники на сотовые телефоны, жевательная резинка, предметы, связанные с курением и т.д.),\n-персонал курит только на улице, в специально отведенных местах,\n-работники ознакомлены с правилами личной гигиены (опрос произвольного работника),\n-наличие актуальных записей в \"Журнале Здоровья\",\n-внешних признаков опасных болезней не присутствует (выборочно, не менее 3 человек)"}, {"n": "2", "text": "В комнате приготовления рабочих растворов МДС имеются инструкции по приготовлению рабочих растворов, мерная емкость. Моющие и дезинфицирующие средства для уборки имеют актуальные сроки годности"}, {"n": "3", "text": "Стерилизатор (работает\\не работает\\чистый)"}, {"n": "4", "text": "\"Перечень учета стеклянных изделий и хрупких материалов\" имеется в наличии, записи в \"Журнале учета стеклянных изделий и хрупких материалов\" актуальны"}, {"n": "5", "text": "Наличие план-графика по санитарной обработке территории, подтверждение его выполнения записями"}, {"n": "6", "text": "Инвентарь для уборки санузлов промаркирован надлежащим образом, хранится отдельно от другого инвентаря"}, {"n": "7", "text": "Персонал, ответственный за уборку санузлов, обеспечен дополнительным комплектом спецодежды (либо ограничен к уборке производственных помещений)"}, {"n": "8", "text": "Инструкции по санитарной обработке находятся в доступном месте"}, {"n": "9", "text": "Инструменты для ремонтных работ переносят и хранят в специальных закрытых ящиках. Ящики чистые, с перечнем инструментов"}, {"n": "10", "text": "Коридоры содержатся в чистоте: - полы, - стены, - потолок, - двери"}, {"n": "11", "text": "Организация мест хранения поддонов (аккуратно сложены в местах их временного накопления)."}, {"n": "12", "text": "Санузлы:\n* содержатся в чистоте, пол убран, раковины, двери и ручки чистые, состояние контейнеров для отходов (не переполнены, в чистом состоянии)"}, {"n": "13", "text": "* ДМС, туалетная бумаг, сушилки для рук в наличии.\nИнструкции по мойке рук расположены рядом с раковинами"}, {"n": "14", "text": "* перед входом в санузел размещена вешалка для снятия рабочей одежды"}, {"n": "15", "text": "* график уборки в наличии, периодичность соблюдается, имеются подписи ответственных лиц"}, {"n": "16", "text": "Душевые:\n* сантехническое оборудование исправно"}, {"n": "17", "text": "* отсутствие следов ржавчины/плесени"}, {"n": "18", "text": "* график уборки в наличии, периодичность соблюдается, имеются подписи ответственных лиц"}, {"n": "19", "text": "Раздевалки:\n* отсутствует пыль на шкафчиках"}, {"n": "20", "text": "* на шкафчиках отсутствуют личные вещи и посторонние предметы"}, {"n": "21", "text": "* двери и дверные ручки, пол чистые"}, {"n": "22", "text": "* график уборки в наличии, периодичность соблюдается, имеются подписи ответственных лиц"}, {"n": "23", "text": "Санпропускники чистые, в рабочем состоянии"}, {"n": "24", "text": "Температура в камерах хранения сырья и ГП (соответствует / не соответствует)"}, {"n": "25", "text": "На площадке размещения мусорного контейнера поддерживается чистота и порядок"}], "scale": "Возможные баллы:    0 - требование не реализуется      1 - требование реализуется нерегулярно/ частично \n2 - требование реализуется постоянно и систематически"}, {"name": "Комната приема пищи", "criteria": [{"n": "1", "text": "Комната приема пищи в надлежащем санитарном состоянии: горизонтальные поверхности чистые, раковины чистые.\n"}, {"n": "2", "text": "Пол чистый, отсутствует мусор, стык стен и полов чистый."}, {"n": "3", "text": "Холодильные камеры для хранения пищи в надлежащем санитарном состоянии."}, {"n": "4", "text": "Микроволновые печи чистые."}, {"n": "5", "text": "Инструкция по санитарной обработке находится в доступном месте."}, {"n": "6", "text": "Моющее и дезинфицирующее средство для мойки рук в диспенсерах есть."}, {"n": "7", "text": "Электросушилка для рук в исправном состоянии."}, {"n": "8", "text": "Инструкция по мойке рук рядом с раковинами в наличии."}, {"n": "9", "text": "Проверяется чистота инсектицидных ламп, журнал в наличии. Записи в журнале актуальны."}, {"n": "10", "text": "Отсутствуют насекомые, птицы, грызуны и следы их жизнедеятельности."}, {"n": "11", "text": "Состояние контейнеров для отходов (не переполнены, в чистом состоянии)"}], "scale": "Возможные баллы:    0 - требование не реализуется      1 - требование реализуется нерегулярно/ частично \n2 - требование реализуется постоянно и систематически"}, {"name": "отдел складской логистики", "criteria": [{"n": "1", "text": "Соблюдение санитарных правил:\n-соблюдение личной гигиены, требований к спецодежде, отсутствие личных вещей работников (часы, наушники на сотовые телефоны, жевательная резинка, предметы, связанные с курением и т.д.),\n-персонал курит только на улице, в специально отведенных местах,\n-работники ознакомлены с правилами личной гигиены (опрос произвольного работника),\n-наличие актуальных записей в \"Журнале Здоровья\",\n-внешних признаков опасных болезней не присутствует (выборочно, не менее 3 человек)."}, {"n": "2", "text": "Условия хранения на складе сухого сырья соответствуют."}, {"n": "3", "text": "Исправность и наполнение гигрометра на складе сухого сырья."}, {"n": "4", "text": "Графики санитарной обработки помещений в наличии. Имеются подписи ответственных лиц. Проверяется эффективность санитарной обработки."}, {"n": "5", "text": "В помещениях нет посторонних запахов. На полу, стенах, потолке отсутствуют следы ржавчины/плесень/облупления краски/щели."}, {"n": "6", "text": "Поддоны, используемые для текущей деятельности, чистые и целые; в зоне приёмки отсутствуют поддоны с сырьём и материалами (кроме прихода)."}, {"n": "7", "text": "Сырье, готовая продукция, упаковочный материал хранятся отдельно, на поддонах. Упаковка не нарушена, чистая. \nСырье, готовая продукция хранятся отдельно от ядовитых, загрязняющих и сильно пахнущих веществ. "}, {"n": "8", "text": "Выделены зона брака.\nНа каждом поддоне – маркировочный лист соответствует установленному образцу."}, {"n": "9", "text": "Закрыты все ворота и двери (внешние и внутренние), кроме использующихся в данный момент. Все проемы, а также открывающиеся окна и форточки в теплое время года защищены сеткой от насекомых."}, {"n": "10", "text": "К стенам есть свободный доступ для уборки и установки ловушек для грызунов."}, {"n": "11", "text": "Отсутствуют насекомые, птицы, грызуны и следы их жизнедеятельности."}, {"n": "12", "text": "Организованы места временного хранения мусора. Емкости для мусора чистые, без следов плесени/грязи"}], "scale": "Возможные баллы:    0 - требование не реализуется      1 - требование реализуется нерегулярно/ частично\n2 - требование реализуется постоянно и систематически"}]</script><script>
const CHECKS=JSON.parse(document.querySelector('#dataset').textContent),KEY='tdh_san_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{days:{}}}catch{db={days:{}}};let day='',idx=0;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Недостаточно памяти телефона. Сделайте резервную копию и освободите место.');return false}}function today(){return new Date().toLocaleDateString('sv-SE')}function getday(d){return db.days[d]||(db.days[d]={engineer:'',checks:{}})}function getcheck(d,i){let x=getday(d);return x.checks[i]||(x.checks[i]={items:CHECKS[i].criteria.map(()=>({score:null,comment:'',photos:[]})),done:false})}function average(c){let a=c.items.filter(x=>x.score!==null);return a.length?a.reduce((s,x)=>s+x.score,0)/a.length:null}function fmt(v){return v===null?'—':v.toFixed(2).replace('.',',')}function completed(d){return Object.values(getday(d).checks).filter(c=>c.done)}function total(d){let a=completed(d).map(average).filter(x=>x!==null);return a.length?a.reduce((s,v)=>s+v,0)/a.length:null}function set(html){$('#app').innerHTML=html}function home(d=day||today()){day=d;let x=getday(day);set(`<div class="card"><h2>Проверка за ${esc(day)}</h2><label>Дата проверки</label><input type="date" value="${day}" onchange="home(this.value)"><label>ФИО сменного инженера-химика</label><input id="engineer" value="${esc(x.engineer)}" placeholder="Введите ФИО" oninput="getday(day).engineer=this.value;save()"><p><b>Завершено: ${completed(day).length} из 11</b> · Общий балл: <b>${fmt(total(day))}</b></p></div>`+CHECKS.map((c,i)=>{let v=x.checks[i],a=v?average(v):null,n=v?v.items.filter(q=>q.score!==null).length:0;return `<div class="card row"><div><b>${esc(c.name)}</b><div class="muted">${v?.done?'✓ Завершено':n?'Черновик':'Не начато'} · ${n}/${c.criteria.length} · балл ${v?.done?fmt(a):'—'}</div></div><button onclick="openCheck(${i})">Открыть</button></div>`}).join('')+`<div class="card actions"><button onclick="dailyReport(day)">Сводный отчёт / PDF</button><button class="secondary" onclick="exportDayExcel(day)">Excel за день</button></div>`)}function openCheck(i){idx=i;let c=CHECKS[i],v=getcheck(day,i);set(`<div class="card"><button class="secondary noprint" onclick="home()">← К участкам</button><h2>${esc(c.name)}</h2><p class="muted">${esc(c.scale)}</p><p><b>Оценено: <span id="progress">${v.items.filter(q=>q.score!==null).length}</span>/${c.criteria.length}</b> · Средний балл: <b id="avg">${fmt(average(v))}</b></p><p class="muted">Оценка 0 или 1 требует комментария ИЛИ фотографии.</p><div id="items">${c.criteria.map((q,j)=>itemHTML(q,v.items[j],j)).join('')}</div><p id="warning" class="error"></p><div class="actions noprint"><button onclick="finish()">Завершить проверку</button><button class="secondary" onclick="save();home()">Сохранить черновик</button><button class="secondary" onclick="reportCheck(day,idx)">PDF / печать</button><button class="secondary" onclick="excelCheck(day,idx)">Excel</button></div></div>`)}function itemHTML(q,a,j){return `<div class="crit" id="q${j}"><b>№ ${esc(q.n)}</b><p>${esc(q.text)}</p><div class="score">${[0,1,2].map(v=>`<button data-v="${v}" class="${a.score===v?'on':''}" onclick="score(${j},${v})">${v} балл${v===1?'':'а'}</button>`).join('')}</div><label>Комментарий</label><textarea rows="2" placeholder="Описание нарушения (если есть)" oninput="comment(${j},this.value)">${esc(a.comment)}</textarea><label class="noprint">Фото (можно несколько)</label><input class="noprint" type="file" accept="image/*" capture="environment" multiple onchange="photos(${j},this)"><div id="photos${j}">${a.photos.map((p,k)=>`<span><img class="photo" src="${p}"><button class="danger noprint" onclick="removePhoto(${j},${k})">×</button></span>`).join('')}</div></div>`}function score(j,v){let a=getcheck(day,idx);a.items[j].score=v;a.done=false;save();openCheck(idx);document.getElementById('q'+j)?.scrollIntoView({block:'center'})}function comment(j,v){let c=getcheck(day,idx);c.items[j].comment=v;c.done=false;save()}async function photos(j,input){let c=getcheck(day,idx);for(let f of input.files){let data=await resize(f);c.items[j].photos.push(data)}c.done=false;save();openCheck(idx);document.getElementById('q'+j)?.scrollIntoView({block:'center'})}function resize(file){return new Promise((resolve,reject)=>{let im=new Image(),url=URL.createObjectURL(file);im.onload=()=>{let k=Math.min(1,1200/Math.max(im.width,im.height)),canvas=document.createElement('canvas');canvas.width=Math.round(im.width*k);canvas.height=Math.round(im.height*k);canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.68))};im.onerror=reject;im.src=url})}function removePhoto(j,k){let c=getcheck(day,idx);c.items[j].photos.splice(k,1);c.done=false;save();openCheck(idx)}function finish(){let c=getcheck(day,idx),bad=[];c.items.forEach((a,j)=>{if(a.score===null||(a.score<2&&!a.comment.trim()&&!a.photos.length))bad.push(j+1)});if(!getday(day).engineer.trim()){alert('Укажите ФИО инженера на главном экране');return}if(bad.length){$('#warning').textContent='Нельзя завершить: проверьте пункты № '+bad.join(', ');document.getElementById('q'+(bad[0]-1)).scrollIntoView({block:'center'});return}c.done=true;c.finishedAt=new Date().toISOString();save();home()}function download(name,blob){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}/* Native offline XLSX writer: OOXML zipped with uncompressed ZIP entries. */

function xlsxSheet(rows){let lines=rows.map((row,i)=>'<row r="'+(i+1)+'"'+(i===0?' ht="34" customHeight="1"':'')+'>'+row.map((v,j)=>{let ref=xlsxCol(j)+(i+1),style=i===0?1:(i===4?2:(typeof v==='number'?(v<2&&j===2?4:3):0));return typeof v==='number'&&Number.isFinite(v)?'<c r="'+ref+'" s="'+style+'"><v>'+v+'</v></c>':'<c r="'+ref+'" s="'+style+'" t="inlineStr"><is><t xml:space="preserve">'+xlsxXml(v)+'</t></is></c>'}).join('')+'</row>').join('');return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="32"/><cols><col min="1" max="1" width="19" customWidth="1"/><col min="2" max="2" width="74" customWidth="1"/><col min="3" max="3" width="19" customWidth="1"/><col min="4" max="4" width="67" customWidth="1"/><col min="5" max="5" width="21" customWidth="1"/></cols><sheetData>'+lines+'</sheetData><pageMargins left="0.3" right="0.3" top="0.5" bottom="0.5" header="0.2" footer="0.2"/><pageSetup orientation="landscape" paperSize="9" fitToWidth="1"/></worksheet>'}

function zipBytes(files){const enc=new TextEncoder(),chunks=[],central=[];let offset=0;const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];function crc(data){let c=0xffffffff;for(let b of data){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}function add(parts){let z=new Uint8Array(parts.flatMap(p=>Array.from(p)));chunks.push(z);offset+=z.length}for(let [name,body] of files){let n=enc.encode(name),d=enc.encode(body),c=crc(d),start=offset;add([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(d.length),u32(d.length),u16(n.length),u16(0),n,d]);central.push([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(d.length),u32(d.length),u16(n.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(start),n])}let cs=offset;for(let c of central)add(c);let size=offset-cs;add([u32(0x06054b50),u16(0),u16(0),u16(central.length),u16(central.length),u32(size),u32(cs),u16(0)]);return new Blob(chunks,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}

function excelCheck(d,i){let c=getday(d).checks[i];if(!c){alert('Проверка не заполнена');return}xls('Чек-лист_'+(i+1)+'_'+d,[['Дата',d],['Инженер',getday(d).engineer],['Участок',CHECKS[i].name],['Средний балл',average(c)],['№','Критерий','Балл','Комментарий','Количество фото'],...CHECKS[i].criteria.map((q,j)=>[q.n,q.text,c.items[j].score??'',c.items[j].comment,c.items[j].photos.length])])}function exportDayExcel(d){xls('Сводный_'+d,[['Дата',d],['Инженер',getday(d).engineer],['Подразделение','Статус','Средний балл','Нарушений'],...CHECKS.map((c,i)=>{let x=getday(d).checks[i];return[c.name,x?.done?'Завершено':'Не завершено',x?.done?fmt(average(x)):'',x?.done?x.items.filter(z=>z.score<2).length:'']}),['ИТОГО','',total(d)]])}function printReport(html){set(`<div class="noprint actions"><button onclick="window.print()">Печать / Сохранить в PDF</button><button class="secondary" onclick="home()">Назад</button></div>`+html)}function reportCheck(d,i){let c=getday(d).checks[i];if(!c){alert('Нет данных');return}let meta=`<div class="card"><h2>${esc(CHECKS[i].name)}</h2><p>ТД Холдинг · ОП Тольятти · ${esc(d)} · ${esc(getday(d).engineer)}</p><p>Статус: ${c.done?'Завершено':'Черновик'} · Средний балл: <b>${fmt(average(c))}</b></p></div>`;printReport(meta+CHECKS[i].criteria.map((q,j)=>{let a=c.items[j];return `<div class="card crit"><b>№ ${esc(q.n)} · ${a.score??'—'} балл(а)</b><p>${esc(q.text)}</p>${a.comment?'<p><b>Комментарий:</b> '+esc(a.comment)+'</p>':''}${a.photos.map(p=>`<img class="photo" style="width:230px;height:auto" src="${p}">`).join('')}</div>`}).join(''))}function dailyReport(d){let cs=completed(d);printReport(`<div class="card"><h2>Сводный санитарный отчёт · ${esc(d)}</h2><p>ТД Холдинг · ОП Тольятти · Инженер: ${esc(getday(d).engineer)}</p><h2>Средний балл: ${fmt(total(d))}</h2><p>Завершено чек-листов: ${cs.length} из 11</p><table><tr><th>Подразделение</th><th>Балл</th><th>Нарушений</th></tr>${CHECKS.map((x,i)=>{let c=getday(d).checks[i];return `<tr><td>${esc(x.nam function r51Weighted(dates){let scores=dates.flatMap(d=>completed(d).map(average)).filter(v=>v!==null);return scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:null}
function r51Stats(dates){let f=dates.flatMap(tdhFindings);return {f,zero:f.filter(x=>x.score===0).length,one:f.filter(x=>x.score===1).length}}
function r51Ranking(dates){return CHECKS.map((c,i)=>{let v=dates.map(d=>getday(d).checks[i]).filter(x=>x?.done),a=v.map(average).filter(x=>x!==null),f=v.flatMap(x=>x.items.filter(z=>z.score===0||z.score===1));return{name:c.name,count:v.length,score:a.length?a.reduce((x,y)=>x+y,0)/a.length:null,zero:f.filter(x=>x.score===0).length,one:f.filter(x=>x.score===1).length}}).sort((a,b)=>a.score===null?1:b.score===null?-1:a.score-b.score)}
function drawDash(month){let dates=r51Dates(month),st=r51Stats(dates),ranking=r51Ranking(dates),mean=r51Weighted(dates),counts=dates.reduce((n,d)=>n+completed(d).length,0);let trends=dates.map(d=>{let f=tdhFindings(d);return '<tr><td>'+esc(d.split('-').reverse().join('.'))+'</td><td>'+completed(d).length+'</td><td><b>'+fmt(total(d))+'</b></td><td>'+f.filter(x=>x.score===0).length+'</td><td>'+f.filter(x=>x.score===1).length+'</td></tr>'}).join('');let common={};st.f.forEach(x=>{let key=x.department+' / '+x.number;if(!common[key])common[key]={department:x.department,criterion:x.criterion,n:0,zero:0};common[key].n++;if(x.score===0)common[key].zero++});let top=Object.values(common).sort((a,b)=>b.n-a.n||b.zero-a.zero).slice(0,5);let html=r51Page(r51Title('УПРАВЛЕНЧЕСКИЙ ОТЧЁТ','Санитарное состояние · '+month,'ТД ХОЛДИНГ · ОП Тольятти')+'<div class="noprint controls"><label>Отчётный месяц<input type="month" value="'+esc(month)+'" onchange="drawDash(this.value)"></label><div class="actions"><button onclick="tdhDashExcel(&#39;'+month+'&#39;)">Excel · 3 листа</button><button onclick="window.print()">PDF / печать</button></div></div><div class="kpis">'+tdhKpi('Средний балл',tdhStatus(mean),'из 2,00')+tdhKpi('Завершено проверок',counts)+tdhKpi('Нарушений',st.f.length)+tdhKpi('Оценок 0',st.zero)+'</div><h3>Рейтинг подразделений</h3><table><thead><tr><th>Подразделение</th><th>Проверок</th><th>Средний балл</th><th>0</th><th>1</th></tr></thead><tbody>'+ranking.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+x.count+'</td><td><b>'+tdhStatus(x.score)+'</b></td><td>'+x.zero+'</td><td>'+x.one+'</td></tr>').join('')+'</tbody></table>');html+=r51Page(r51Title('ДИНАМИКА','Результаты по дням',month+' · только дни с завершёнными проверками')+'<table><thead><tr><th>Дата</th><th>Проверок</th><th>Средний балл</th><th>Оценок 0</th><th>Оценок 1</th></tr></thead><tbody>'+(trends||'<tr><td colspan="5">Завершённых проверок нет</td></tr>')+'</tbody></table><h3>Основные проблемные критерии</h3><table><thead><tr><th>Подразделение</th><th>Критерий</th><th>Случаев</th></tr></thead><tbody>'+top.map(x=>'<tr><td>'+esc(x.department)+'</td><td>'+esc(x.criterion)+'</td><td>'+x.n+'</td></tr>').join('')+'</tbody></table><p class="muted footer-note">Подробный реестр всех замечаний доступен в Excel. Средний балл месяца рассчитан по завершённым проверкам.</p>');set(html)}
function tdhDashExcel(month){let dates=r51Dates(month);tdhExport('ТДХ_Дашборд_'+month,[['Динамика',[['Дата','Завершено','Средний балл','Оценок 0','Оценок 1'],...dates.map(d=>{let f=tdhFindings(d);return[d,completed(d).length,total(d),f.filter(x=>x.score===0).length,f.filter(x=>x.score===1).length]})]],['Рейтинг',[['Подразделение','Средний балл','Проверок','Оценок 0','Оценок 1'],...r51Ranking(dates).map(x=>[x.name,x.score??'',x.count,x.zero,x.one])]],['Нарушения',[['Дата','Подразделение','№','Критерий','Балл','Комментарий','Фото'],...dates.flatMap(tdhFindings).map(x=>[x.date,x.department,x.number,x.criterion,x.score,x.comment,x.photos.length])]]])}
function dailyReport(d){let rows=tdhRows(d),f=tdhFindings(d),valid=rows.filter(x=>x.done),critical=f.filter(x=>x.score===0),top=f.slice().sort((a,b)=>a.score-b.score).slice(0,5);let html=r51Page(r51Title('ЕЖЕДНЕВНАЯ СВОДКА','Санитарный контроль · '+d,'Инженер-химик: '+(getday(d).engineer||'не указан'))+'<div class="noprint actions"><button onclick="exportDayExcel(&#39;'+d+'&#39;)">Excel · полный реестр</button><button onclick="window.print()">PDF / печать</button></div><div class="kpis">'+tdhKpi('Средний балл',tdhStatus(total(d)),'из 2,00')+tdhKpi('Завершено',valid.length+'/'+CHECKS.length)+tdhKpi('Нарушений',f.length)+tdhKpi('Оценок 0',critical.length)+'</div><h3>Результаты подразделений</h3><table><thead><tr><th>Подразделение</th><th>Статус</th><th>Балл</th><th>Оценок 0</th><th>Оценок 1</th></tr></thead><tbody>'+rows.map((x,i)=>{let c=getday(d).checks[i],a=c?.done?c.items:[];return '<tr><td>'+esc(x.name)+'</td><td>'+(x.done?'Завершено':'Не проверено')+'</td><td>'+tdhStatus(x.score)+'</td><td>'+(x.done?a.filter(z=>z.score===0).length:'—')+'</td><td>'+(x.done?a.filter(z=>z.score===1).length:'—')+'</td></tr>'}).join('')+'</tbody></table>');if(top.length)html+=r51Page(r51Title('ПРИОРИТЕТЫ','Основные замечания',d+' · до пяти наиболее существенных')+'<table><thead><tr><th>Подразделение</th><th>Балл</th><th>Критерий / комментарий</th></tr></thead><tbody>'+top.map(x=>'<tr><td>'+esc(x.department)+'</td><td>'+x.score+'</td><td>'+esc(x.criterion)+(x.comment?'<br><b>'+esc(x.comment)+'</b>':'')+'</td></tr>').join('')+'</tbody></table><p class="muted footer-note">Все замечания без сокращений выгружаются в Excel.</p>');printReport(html)}
function reportCheck(d,i){let c=getday(d).checks[i];if(!c){alert('Нет данных');return}let checks=CHECKS[i],items=c.items||[],bad=items.filter(x=>x.score===0||x.score===1).length;let html=r51Page(r51Title('ПРОТОКОЛ САНИТАРНОЙ ПРОВЕРКИ',checks.name,d+' · инженер-химик: '+(getday(d).engineer||'не указан'))+'<div class="noprint actions"><button onclick="excelCheck(&#39;'+d+'&#39;,'+i+')">Excel · полный чек-лист</button><button onclick="window.print()">PDF / печать</button></div><div class="kpis">'+tdhKpi('Средний балл',tdhStatus(average(c)),'из 2,00')+tdhKpi('Критериев',checks.criteria.length)+tdhKpi('Нарушений',bad)+tdhKpi('Статус',c.done?'Завершено':'Черновик')+'</div><h3>Полный перечень критериев</h3><table class="full-check"><thead><tr><th>№</th><th>Критерий проверки</th><th>Балл</th><th>Комментарий</th></tr></thead><tbody>'+checks.criteria.map((q,j)=>{let a=items[j]||{};return '<tr><td>'+esc(q.n)+'</td><td>'+esc(q.text)+'</td><td class="score-'+a.score+'">'+(a.score??'—')+'</td><td>'+esc(a.comment||'—')+'</td></tr>'}).join('')+'</tbody></table>');let photos=checks.criteria.flatMap((q,j)=>(items[j]?.photos||[]).map(src=>({src,q,comment:items[j]?.comment||''})));if(photos.length)html+=r51Page(r51Title('ФОТОМАТЕРИАЛЫ',checks.name,'Приложение к протоколу от '+d)+'<div class="photo-grid">'+photos.map(x=>'<div class="photo-card"><b>№ '+esc(x.q.n)+'</b><p>'+esc(x.q.text)+'</p><img src="'+x.src+'"><p>'+esc(x.comment)+'</p></div>').join('')+'</div>');html+=r51Page('<h3>Подписи по результатам проверки</h3><table class="signatures"><thead><tr><th>Должность</th><th>ФИО</th><th>Подпись</th></tr></thead><tbody><tr><td>Инженер-химик</td><td>'+esc(getday(d).engineer||'________________________')+'</td><td>________________</td></tr><tr><td>Мастер-технолог</td><td>________________________</td><td>________________</td></tr><tr><td>Проверяемый</td><td>________________________</td><td>________________</td></tr></tbody></table>');printReport(html)}
</script></body></html>
