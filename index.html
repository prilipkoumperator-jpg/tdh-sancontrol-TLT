</style></head><body><header><h1>ТД ХОЛДИНГ · Санитарный контроль</h1><small>ОП Тольятти · автономная версия 5.7 · управленческая отчётность</small></header><div class="wrap"><nav class="noprint"><button onclick="home()">Проверки</button><button onclick="history()">История</button><button onclick="dashboard()">Дашборд</button><button onclick="settings()">Резервная копия</button></nav><main id="app"></main></div><script id="dataset" type="application/json">[{"name": "цех производства пельменей", "criteria": [{"n": "1", "text": "Температура в производственном помещении (соответствует / не соответствует)"}, {"n": "2", "text": "Весы (настольные / напольные), используемые в текущей деятельности, чистые, в рабочем состоянии."}, {"n": "3", "text": "Рукомойники в исправном состоянии, горячая и холодная вода есть, моющее и дезинфицирующее средство для мойки рук в диспенсерах есть. Инструкция по мойке рук рядом с раковинами в наличии."}, {"n": "4", "text": "Графики санитарной обработки помещений в наличии. Имеются подписи ответственных лиц. Проверяется эффективность санитарной обработки. На рабочих местах имеются актуальные инструкции по санитарной обработке."}, {"n": "5", "text": "В помещении нет посторонних запахов. На полу, стенах, потолке отсутствуют следы ржавчины, плесени, облупления краски, щели."}, {"n": "6", "text": "Трапы чистые, не засорены."}, {"n": "7", "text": "Определено место для хранения уборочного инвентаря. Инвентарь промаркирован."}, {"n": "8", "text": "Оборудование в чистом состоянии, на оборудовании отсутствуют следы технологических жидкостей:\n- загрузочный бункер, \n- транспортёрная линия, \n- тестомесильный аппарат, \n- линия по производству пельменей, \n- пульт управления, \n- дозирующее устройство для муки"}, {"n": "9", "text": "Сырьё/отходы не размещаются на полу - хранение только на поддонах."}, {"n": "10", "text": "Проверяется чистота инсектицидных ламп, журнал в наличии. Записи в журнале актуальны."}, {"n": "11", "text": "Закрыты все ворота и двери (внешние и внутренние), кроме использующихся в данный момент. "}, {"n": "12", "text": "К стенам есть свободный доступ для уборки."}, {"n": "13", "text": "Организованы места временного хранения мусора. Емкости для мусора идентифицированы."}, {"n": "14", "text": "Исправность и наполнение гигрометров психрометрических."}, {"n": "15", "text": "Отсутствуют насекомые, птицы, грызуны и следы их жизнедеятельности."}, {"n": "16", "text": "Стеллажи/столы чистые, на поверхности отсутствуют посторонние предметы."}], "scale": "Возможные баллы: 0 - требование не реализуется; 1 - требование реализуется нерегулярно/ частично; 2 - требование реализуется постоянно и систематически"}, {"name": "цех производства ФИЛО", "criteria": [{"n": "1", "text": "Температура в производственном помещении (соответствует / не соответствует)"}, {"n": "2", "text": "Весы (настольные / напольные), используемые в текущей деятельности, чистые, в рабочем состоянии."}, {"n": "3", "text": "Рукомойник в исправном состоянии, горячая и холодная вода есть, моющее и дезинфицирующее  средство для мойки рук в диспенсерах есть. Инструкция по мойке рук рядом с раковинами в наличии."}, {"n": "4", "text": "Графики санитарной обработки помещений в наличии. Имеются подписи ответственных лиц. Проверяется эффективность санитарной обработки. На рабочих местах имеются актуальные инструкции по санитарной обработке."}, {"n": "5", "text": "В помещении нет посторонних запахов. На полу, стенах, потолке отсутствуют следы ржавчины, плесени, облупления краски, щели."}, {"n": "6", "text": "Трапы чистые, не засорены."}, {"n": "7", "text": "Определено место для хранения уборочного инвентаря. Инвентарь промаркирован. "}, {"n": "8", "text": "Оборудование в чистом состоянии, на оборудовании отсутствуют следы технологических жидкостей:\n- транспортёрная линия, \n- пульт управления,\n-тестоделитель,                                                                                                                                            -  "3", "text": "Весы (настольные / напольные), используемые в текущей деятельности, чистые, в рабочем состоянии."}, {"n": "4", "text": "Рукомойники в исправном состоянии, горячая и холодная вода есть, МДС для мойки рук в диспенсерах есть. Инструкция по мойке рук рядом с раковинами в наличии."}, {"n": "5", "text": "Графики санитарной обработки помещений в наличии. Имеются подписи ответственных лиц. Проверяется эффективность санитарной обработки. На рабочих местах имеются актуальные инструкции по санитарной обработке."}, {"n": "6", "text": "В помещении нет посторонних запахов. На полу, стенах, потолке отсутствуют следы ржавчины, плесени, облупления краски, щели."}, {"n": "7", "text": "Трапы чистые, не засорены."}, {"n": "8", "text": "Определено место для хранения уборочного инвентаря. Инвентарь промаркирован."}, {"n": "9", "text": "Поддоны, используемые для текущей деятельности, чистые/целые."}, {"n": "10", "text": "Оборудование в чистом состоянии, на оборудовании отсутствуют следы технологических жидкостей, пыли, грязи, специй, сырья:\n- куттер, \n- волчок, \n- фаршемешалка, \n- блокорезка."}, {"n": "11", "text": "Проверяется чистота инсектицидных ламп, журнал в наличии. Записи в журнале актуальны."}, {"n": "12", "text": "Закрыты все ворота и двери (внешние и внутренние), кроме использующихся в данный момент. "}, {"n": "13", "text": "К стенам есть свободный доступ для уборки."}, {"n": "14", "text": "Отсутствуют насекомые, птицы, грызуны и следы их жизнедеятельности."}, {"n": "15", "text": "Организованы места временного хранения мусора. Емкости для мусора идентифицированы."}, {"n": "16", "text": "Ёмкости с сырьём закрыты."}, {"n": "17", "text": "Стеллажи/столы чистые, на поверхности отсутствуют посторонние предметы."}], "scale": "Возможные баллы:    0 - требование не реализуется      1 - требование реализуется нерегулярно/ частично\n2 - требование реализуется постоянно и систематически"}, {"name": "территория", "criteria": [{"n": "1", "text": "Соблюдение санитарных правил:\n-соблюдение личной гигиены, требований к спецодежде, отсутствие личных вещей работников (часы, наушники на сотовые телефоны, жевательная резинка, предметы, связанные с курением и т.д.),\n-персонал курит только на улице, в специально отведенных местах,\n-работники ознакомлены с правилами личной гигиены (опрос произвольного работника),\n-наличие актуальных записей в \"Журнале Здоровья\",\n-внешних признаков опасных болезней не присутствует (выборочно, не менее 3 человек)"}, {"n": "2", "text": "В комнате приготовления рабочих растворов МДС имеются инструкции по приготовлению рабочих растворов, мерная емкость. Моющие и дезинфицирующие средства для уборки имеют актуальные сроки годности"}, {"n": "3", "text": "Стерилизатор (работает\\не работает\\чистый)"}, {"n": "4", "text": "\"Перечень учета стеклянных изделий и хрупких материалов\" имеется в наличии, записи в \"Журнале учета стеклянных изделий и хрупких материалов\" актуальны"}, {"n": "5", "text": "Наличие план-графика по санитарной обработке территории, подтверждение его выполнения записями"}, {"n": "6", "text": "Инвентарь для уборки санузлов промаркирован надлежащим образом, хранится отдельно от другого инвентаря"}, {"n": "7", "text": "Персонал, ответственный за уборку санузлов, обеспечен дополнительным комплектом спецодежды (либо ограничен к уборке производственных помещений)"}, {"n": "8", "text": "Инструкции по санитарной обработке находятся в доступном месте"}, {"n": "9", "text": "Инструменты для ремонтных работ переносят и хранят в специальных закрытых ящиках. Ящики чистые, с перечнем инструментов"}, {"n": "10", "text": "Коридоры содержатся в чистоте: - полы, - стены, - потолок, - двери"}, {"n": "11", "text": "Организация мест хранения поддонов (аккуратно сложены в местах их временного накопления)."}, {"n": "12", "text": "Санузлы:\n* содержатся в чистоте, пол убран, раковины, двери и ручки чистые, состояние контейнеров для отходов (не переполнены, в чистом состоянии)"}, {"n": "13", "text": "* ДМС, туалетная бумаг, сушилки для рук в наличии.\nИнструкции по мойке рук расположены рядом с раковинами"}, {"n": "14", "text": "* перед входом в санузел размещена вешалка для снятия рабочей одежды"}, {"n": "15", "text": "* график уборки в наличии, периодичность соблюдается, имеются подписи ответственных лиц"}, {"n": "16", "text": "Душевые:\n* сантехническое оборудование исправно"}, {"n": "17", "text": "* отсутствие следов ржавчины/плесени"}, {"n": "18", "text": "* график уборки в наличии, периодичность соблюдается, имеются подписи ответственных лиц"}, {"n": "19", "text": "Раздевалки:\n* отсутствует пыль на шкафчиках"}, {"n": "20", "text": "* на шкафчиках отсутствуют личные вещи и посторонние предметы"}, {"n": "21", "text": "* двери и дверные ручки, пол чистые"}, {"n": "22", "text": "* график уборки в наличии, периодичность соблюдается, имеются подписи ответственных лиц"}, {"n": "23", "text": "Санпропускники чистые, в рабочем состоянии"}, {"n": "24", "text": "Температура в камерах хранения сырья и ГП (соответствует / не соответствует)"}, {"n": "25", "text": "На площадке размещения мусорного контейнера поддерживается чистота и порядок"}], "scale": "Возможные баллы:    0 - требование не реализуется      1 - требование реализуется нерегулярно/ частично \n2 - требование реализуется постоянно и систематически"}, {"name": "Комната приема пищи", "criteria": [{"n": "1", "text": "Комната приема пищи в надлежащем санитарном состоянии: горизонтальные поверхности чистые, раковины чистые.\n"}, {"n": "2", "text": "Пол чистый, отсутствует мусор, стык стен и полов чистый."}, {"n": "3", "text": "Холодильные камеры для хранения пищи в надлежащем санитарном состоянии."}, {"n": "4", "text": "Микроволновые печи чистые."}, {"n": "5", "text": "Инструкция по санитарной обработке находится в доступном месте."}, {"n": "6", "text": "Моющее и дезинфицирующее средство для мойки рук в диспенсерах есть."}, {"n": "7", "text": "Электросушилка для рук в исправном состоянии."}, {"n": "8", "text": "Инструкция по мойке рук рядом с раковинами в наличии."}, {"n": "9", "text": "Проверяется чистота инсектицидных ламп, журнал в наличии. Записи в журнале актуальны."}, {"n": "10", "text": "Отсутствуют насекомые, птицы, грызуны и следы их жизнедеятельности."}, {"n": "11", "text": "Состояние контейнеров для отходов (не переполнены, в чистом состоянии)"}], "scale": "Возможные баллы:    0 - требование не реализуется      1 - требование реализуется нерегулярно/ частично \n2 - требование реализуется постоянно и систематически"}, {"name": "отдел складской логистики", "criteria": [{"n": "1", "text": "Соблюдение санитарных правил:\n-соблюдение личной гигиены, требований к спецодежде, отсутствие личных вещей работников (часы, наушники на сотовые телефоны, жевательная резинка, предметы, связанные с курением и т.д.),\n-персонал курит только на улице, в специально отведенных местах,\n-работники ознакомлены с правилами личной гигиены (опрос произвольного работника),\n-наличие актуальных записей в \"Журнале Здоровья\",\n-внешних признаков опасных болезней не присутствует (выборочно, не менее 3 человек)."}, {"n": "2", "text": "Условия хранения на складе сухого сырья соответствуют."}, {"n": "3", "text": "Исправность и наполнение гигрометра на складе сухого сырья."}, {"n": "4", "text": "Графики санитарной обработки помещений в наличии. Имеются подписи ответственных лиц. Проверяется эффективность санитарной обработки."}, {"n": "5", "text": "В помещениях нет посторонних запахов. На полу, стенах, потолке отсутствуют следы ржавчины/плесень/облупления краски/щели."}, {"n": "6", "text": "Поддоны, используемые для текущей деятельности, чистые и целые; в зоне приёмки отсутствуют поддоны с сырьём и материалами (кроме прихода)."}, {"n": "7", "text": "Сырье, готовая продукция, упаковочный материал хранятся отдельно, на поддонах. Упаковка не нарушена, чистая. \nСырье, готовая продукция хранятся отдельно от ядовитых, загрязняющих и сильно пахнущих веществ. "}, {"n": "8", "text": "Выделены зона брака.\nНа каждом поддоне – маркировочный лист соответствует установленному образцу."}, {"n": "9", "text": "Закрыты все ворота и двери (внешние и внутренние), кроме использующихся в данный момент. Все проемы, а также открывающиеся окна и форточки в теплое время года защищены сеткой от насекомых."}, {"n": "10", "text": "К стенам есть свободный доступ для уборки и установки ловушек для грызунов."}, {"n": "11", "text": "Отсутствуют насекомые, птицы, грызуны и следы их жизнедеятельности."}, {"n": "12", "text": "Организованы места временного хранения мусора. Емкости для мусора чистые, без следов плесени/грязи"}], "scale": "Возможные баллы:    0 - требование не реализуется      1 - требование реализуется нерегулярно/ частично\n2 - требование реализуется постоянно и систематически"}]</script><script>
const CHECKS=JSON.parse(document.querySelector('#dataset').textContent),KEY='tdh_san_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{days:{}}}catch{db={days:{}}};let day='',idx=0;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Недостаточно памяти телефона. Сделайте резервную копию и освободите место.');return false}}function today(){return new Date().toLocaleDateString('sv-SE')}function getday(d){return db.days[d]||(db.days[d]={engineer:'',checks:{}})}function getcheck(d,i){let x=getday(d);return x.checks[i]||(x.checks[i]={items:CHECKS[i].criteria.map(()=>({score:null,comment:'',photos:[]})),done:false})}function average(c){let a=c.items.filter(x=>x.score!==null);return a.length?a.reduce((s,x)=>s+x.score,0)/a.length:null}function fmt(v){return v===null?'—':v.toFixed(2).replace('.',',')}function completed(d){return Object.values(getday(d).checks).filter(c=>c.done)}function total(d){let a=completed(d).map(average).filter(x=>x!==null);return a.length?a.reduce((s,v)=>s+v,0)/a.length:null}function set(html){$('#app').innerHTML=html}function home(d=day||today()){day=d;let x=getday(day);set(`<div class="card"><h2>Проверка за ${esc(day)}</h2><label>Дата проверки</label><input type="date" value="${day}" onchange="home(this.value)"><label>ФИО сменного инженера-химика</label><input id="engineer" value="${esc(x.engineer)}" placeholder="Введите ФИО" oninput="getday(day).engineer=this.value;save()"><p><b>Завершено: ${completed(day).length} из 11</b> · Общий балл: <b>${fmt(total(day))}</b></p></div>`+CHECKS.map((c,i)=>{let v=x.checks[i],a=v?average(v):null,n=v?v.items.filter(q=>q.score!==null).length:0;return `<div class="card row"><div><b>${tdhLabel(c.name)}</b><div class="muted">${v?.done?'✓ Завершено':n?'Черновик':'Не начато'} · ${n}/${c.criteria.length} · балл ${v?.done?fmt(a):'—'}</div></div><button onclick="openCheck(${i})">Открыть</button></div>`}).join('')+`<div class="card actions"><button onclick="dailyReport(day)">Сводный отчёт / PDF</button><button class="secondary" onclick="exportDayExcel(day)">Excel за день</button></div>`)}function openCheck(i){idx=i;let c=CHECKS[i],v=getcheck(day,i);set(`<div class="card"><button class="secondary noprint" onclick="home()">← К участкам</button><h2>${tdhLabel(c.name)}</h2><p class="muted">${esc(c.scale)}</p><p><b>Оценено: <span id="progress">${v.items.filter(q=>q.score!==null).length}</span>/${c.criteria.length}</b> · Средний балл: <b id="avg">${fmt(average(v))}</b></p><p class="muted">Оценка 0 или 1 требует комментария ИЛИ фотографии.</p><div id="items">${c.criteria.map((q,j)=>itemHTML(q,v.items[j],j)).join('')}</div><p id="warning" class="error"></p><div class="actions noprint"><button onclick="finish()">Завершить проверку</button><button class="secondary" onclick="save();home()">Сохранить черновик</button><button class="secondary" onclick="reportCheck(day,idx)">PDF / печать</button><button class="secondary" onclick="excelCheck(day,idx)">Excel</button></div></div>`)}function itemHTML(q,a,j){return `<div class="crit" id="q${j}"><b>№ ${esc(q.n)}</b><p>${esc(q.text)}</p><div class="score">${[0,1,2].map(v=>`<button data-v="${v}" class="${a.score===v?'on':''}" onclick="score(${j},${v})">${v} балл${v===1?'':'а'}</button>`).join('')}</div><label>Комментарий</label><textarea rows="2" placeholder="Описание нарушения (если есть)" oninput="comment(${j},this.value)">${esc(a.comment)}</textarea><label class="noprint">Фото (можно несколько)</label><input class="noprint" type="file" accept="image/*" capture="environment" multiple onchange="photos(${j},this)"><div id="photos${j}">${a.photos.map((p,k)=>`<span><img class="photo" src="${p}"><button class="danger noprint" onclick="removePhoto(${j},${k})">×</button></span>`).join('')}</div></div>`}function score(j,v){let a=getcheck(day,idx);a.items[j].score=v;a.done=false;save();openCheck(idx);document.getElementById('q'+j)?.scrollIntoView({block:'center'})}function comment(j,v){let c=getcheck(day,idx);c.items[j].comment=v;c.done=false;save()}async function photos(j,input){let c=getcheck(day,idx);for(let f of input.files){let data=await resize(f);c.items[j].photos.push(data)}c.done=false;save();openCheck(idx);document.getElementById('q'+j)?.scrollIntoView({block:'center'})}function resize(file){return new Promise((resolve,reject)=>{let im=new Image(),url=URL.createObjectURL(file);im.onload=()=>{let k=Math.min(1,1200/Math.max(im.width,im.height)),canvas=document.createElement('canvas');canvas.width=Math.round(im.width*k);canvas.height=Math.round(im.height*k);canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.68))};im.onerror=reject;im.src=url})}function removePhoto(j,k){let c=getcheck(day,idx);c.items[j].photos.splice(k,1);c.done=false;save();openCheck(idx)}function finish(){let c=getcheck(day,idx),bad=[];c.items.forEach((a,j)=>{if(a.score===null||(a.score<2&&!a.comment.trim()&&!a.photos.length))bad.push(j+1)});if(!getday(day).engineer.trim()){alert('Укажите ФИО инженера на главном экране');return}if(bad.length){$('#warning').textContent='Нельзя завершить: проверьте пункты № '+bad.join(', ');document.getElementById('q'+(bad[0]-1)).scrollIntoView({block:'center'});return}c.done=true;c.finishedAt=new Date().toISOString();save();home()}function download(name,blob){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}/* Native offline XLSX writer: OOXML zipped with uncompressed ZIP entries. */

function xlsxSheet(rows){let lines=rows.map((row,i)=>'<row r="'+(i+1)+'"'+(i===0?' ht="34" customHeight="1"':'')+'>'+row.map((v,j)=>{let ref=xlsxCol(j)+(i+1),style=i===0?1:(i===4?2:(typeof v==='number'?(v<2&&j===2?4:3):0));return typeof v==='number'&&Number.isFinite(v)?'<c r="'+ref+'" s="'+style+'"><v>'+v+'</v></c>':'<c r="'+ref+'" s="'+style+'" t="inlineStr"><is><t xml:space="preserve">'+xlsxXml(v)+'</t></is></c>'}).join('')+'</row>').join('');return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="32"/><cols><col min="1" max="1" width="19" customWidth="1"/><col min="2" max="2" width="74" customWidth="1"/><col min="3" max="3" width="19" customWidth="1"/><col min="4" max="4" width="67" customWidth="1"/><col min="5" max="5" width="21" customWidth="1"/></cols><sheetData>'+lines+'</sheetData><pageMargins left="0.3" right="0.3" top="0.5" bottom="0.5" header="0.2" footer="0.2"/><pageSetup orientation="landscape" paperSize="9" fitToWidth="1"/></worksheet>'}

function zipBytes(files){const enc=new TextEncoder(),chunks=[],central=[];let offset=0;const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];function crc(data){let c=0xffffffff;for(let b of data){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}function add(parts){let z=new Uint8Array(parts.flatMap(p=>Array.from(p)));chunks.push(z);offset+=z.length}for(let [name,body] of files){let n=enc.encode(name),d=enc.encode(body),c=crc(d),start=offset;add([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(d.length),u32(d.length),u16(n.length),u16(0),n,d]);central.push([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(d.length),u32(d.length),u16(n.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(start),n])}let cs=offset;for(let c of central)add(c);let size=offset-cs;add([u32(0x06054b50),u16(0),u16(0),u16(central.length),u16(central.length),u32(size),u32(cs),u16(0)]);return new Blob(chunks,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}

function xlsMulti(name,sheets){try{let content='<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((_,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>';let files=[['[Content_Types].xml',content],['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((x,i)=>'<sheet name="'+xlsxXml(x[0].replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31))+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>'],['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],[' function excelCheck(d,i){let c=getday(d).checks[i];if(!c){alert('Проверка не заполнена');return}xls('Чек-лист_'+(i+1)+'_'+d,[['Дата',d],['Инженер',getday(d).engineer],['Участок',CHECKS[i].name],['Средний балл',average(c)],['№','Критерий','Балл','Комментарий','Количество фото'],...CHECKS[i].criteria.map((q,j)=>[q.n,q.text,c.items[j].score??'',c.items[j].comment,c.items[j].photos.length])])}function exportDayExcel(d){xls('Сводный_'+d,[['Дата',d],['Инженер',getday(d).engineer],['Подразделение','Статус','Средний балл','Нарушений'],...CHECKS.map((c,i)=>{let x=getday(d).checks[i];return[c.name,x?.done?'Завершено':'Не завершено',x?.done?fmt(average(x)):'',x?.done?x.items.filter(z=>z.score<2).length:'']}),['ИТОГО','',total(d)]])}function printReport(html){set(`<div class="noprint actions"><button onclick="window.print()">Печать / Сохранить в PDF</button><button class="secondary" onclick="home()">Назад</button></div>`+html)}function reportCheck(d,i){let c=getday(d).checks[i];if(!c){alert('Нет данных');return}let meta=`<div class="card"><h2>${esc(CHECKS[i].name)}</h2><p>ТД Холдинг · ОП Тольятти · ${esc(d)} · ${esc(getday(d).engineer)}</p><p>Статус: ${c.done?'Завершено':'Черновик'} · Средний балл: <b>${fmt(average(c))}</b></p></div>`;printReport(meta+CHECKS[i].criteria.map((q,j)=>{let a=c.items[j];return `<div class="card crit"><b>№ ${esc(q.n)} · ${a.score??'—'} балл(а)</b><p>${esc(q.text)}</p>${a.comment?'<p><b>Комментарий:</b> '+esc(a.comment)+'</p>':''}${a.photos.map(p=>`<img class="photo" style="width:230px;height:auto" src="${p}">`).join('')}</div>`}).join(''))}function dailyReport(d){let cs=completed(d);printReport(`<div class="card"><h2>Сводный санитарный отчёт · ${esc(d)}</h2><p>ТД Холдинг · ОП Тольятти · Инженер: ${esc(getday(d).engineer)}</p><h2>Средний балл: ${fmt(total(d))}</h2><p>Завершено чек-листов: ${cs.length} из 11</p><table><tr><th>Подразделение</th><th>Балл</th><th>Нарушений</th></tr>${CHECKS.map((x,i)=>{let c=getday(d).checks[i];return `<tr><td>${esc(x.nam  byDept.slice(0,7).forEach((r,i)=>{let yy=y+i*64;txt(c,r.name,55,yy+18,20,true,'#17334e',500);bar(c,565,yy,360,26,(r.zero*2+r.one)/Math.max(1,...byDept.map(z=>z.zero*2+z.one)),'#d05b57');txt(c,`${r.zero} крит. / ${r.one} част.`,945,yy+20,18)});
 let yy=y+byDept.slice(0,7).length*64+18;if(yy<730)note(c,'ДЕЙСТВИЕ',`Начать с подразделения «${byDept[0].name}»: ${byDept[0].zero} оценок 0 и ${byDept[0].one} оценок 1.`,yy)
 }));
 let common={};finds.forEach(f=>{let k=f.department+'|'+f.number;let a=common[k]||(common[k]={dept:f.department,criterion:f.criterion,n:0,zero:0});a.n++;if(f.score===0)a.zero++});let top=Object.values(common).sort((a,b)=>b.n-a.n||b.zero-a.zero);
 if(dates.length>1&&top.length)group(top.filter(z=>z.n>1).slice(0,8),8).filter(z=>z.length).forEach((part,i)=>slides.push(slide('04 / ПОВТОРЯЕМОСТЬ','Проблемные критерии'+(i?' · '+(i+1):''),'Количество фиксаций за отчётный период',(c,y)=>{
 table(c,['Подразделение','Критерий','Случаев'],part.map(z=>[z.dept,z.criterion,z.n]),y,[.28,.60,.12],{rowH:75,size:16});
 let yy=y+49+part.length*75+24;if(yy<730)note(c,'КОНТРОЛЬ ПОВТОРЯЕМОСТИ',dates.length<2?'Для оценки повторяемости нужны проверки за несколько дат.':'Проверить повторные отклонения и эффективность принятых мер.',yy)
 })));
 slides.push(slide('05 / УПРАВЛЕНЧЕСКИЕ РЕШЕНИЯ','План действий','Приоритеты сформированы автоматически по результатам проверок',(c,y)=>{
 let priority=byDept.filter(x=>x.zero+x.one).slice(0,4);if(!priority.length){txt(c,'Нарушения по завершённым проверкам не зарегистрированы.',55,y+35,25);return}
 priority.forEach((r,i)=>{let yy=y+i*111;c.fillStyle=i%2?'#f2f7fa':'#eaf3fa';c.fillRect(55,yy,1080,99);txt(c,`${i+1}. ${r.name}`,75,yy+30,22,true,color,970);txt(c,`Оценок 0: ${r.zero}  •  оценок 1: ${r.one}  •  назначить ответственного и срок устранения`,75,yy+69,19)});
 let yy=y+priority.length*111+18;if(yy<730)note(c,'ПОСЛЕДУЮЩИЙ КОНТРОЛЬ','Проверить устранение замечаний при следующем санитарном обходе.',yy)
 }));
 pdfBuild('ТДХ_Месячный_управленческий_'+month,slides).catch(e=>alert('Ошибка PDF: '+e.message));
}
function dayPdf(d){let rows=tdhRows(d),f=tdhFindings(d),valid=rows.filter(x=>x.done);let slides=[slide('Ежедневная управленческая сводка','Санитарный контроль · '+d,'Инженер-химик: '+(getday(d).engineer||'не указан'),(c,y)=>{y=kpis(c,[['Средний балл',valid.length?fmt(total(d)):'—'],['Завершено',valid.length+'/'+CHECKS.length],['Нарушений',f.length],['Оценок 0',f.filter(x=>x.score===0).length]],y+8);txt(c,'Результаты завершённых проверок',55,y+7,25,true);table(c,['Подразделение','Балл','Оценок 0','Оценок 1','Нарушений'],valid.slice(0,7).map(r=>{let x=f.filter(z=>z.department===r.name);return [r.name,fmt(r.score),x.filter(z=>z.score===0).length,x.filter(z=>z.score===1).length,x.length]}),y+28,[.48,.13,.13,.13,.13],{rowH:53,size:17});if(!valid.length)txt(c,'За выбранную дату завершённых проверок нет.',55,y+110,23)} )];

 if(f.length)slides.push(slide('Приоритеты дня','Ключевые замечания',d,(c,y)=>{let key=f.slice().sort((a,b)=>a.score-b.score).slice(0,6);table(c,['Подразделение','Замечание / комментарий','Балл'],key.map(x=>[x.department,x.comment||x.criterion,x.score]),y,[.28,.62,.10],{rowH:76,size:16});txt(c,'Полный перечень нарушений и комментариев — в Excel-выгрузке.',55, y+55+key.length*76,18,false,'#667b8e')}));pdfBuild('ТДХ_Ежедневный_'+d,slides)}
function checkPdf(d,i){let check=CHECKS[i],record=getday(d).checks[i];if(!record){alert('Нет данных');return}let rows=check.criteria.map((q,j)=>({q,a:record.items[j]||{}}));let slides=[];
 // Портретный протокол: все критерии, включая оценки 2, и подписи после последнего пункта.
 group(rows,8).forEach((part,p)=>slides.push((ctx,w,h)=>{let y=base(ctx,w,h,'Протокол санитарной проверки',check.name,`${d} • инженер-химик: ${getday(d).engineer||'не указан'} • часть ${p+1}`);let cols=[55,92,505,570],widths=[37,413,65,214];ctx.fillStyle='#eaf3fa';ctx.fillRect(55,y,730,43);['№','Критерий','Балл','Комментарий'].forEach((t,j)=>txt(ctx,t,cols[j]+4,y+28,15,true));y+=45;
 part.forEach(({q,a},idx)=>{let rh=76;ctx.fillStyle=idx%2?'#f1f6fa':'#fff';ctx.fillRect(55,y,730,rh);const drawWrap=(value,x,maxWidth,size=14)=>{ctx.font=size+'px Arial';let line='',lines=[],words=String(value===null||value===undefined?'':value).split(/\s+/);for(let word of words){let t=line?line+' '+word:word;if(ctx.measureText(t).width>maxWidth&&line){lines.push(line);line=word}else line=t}if(line)lines.push(line);lines.slice(0,4).forEach((l,k)=>{ctx.fillStyle='#19364e';ctx.fillText(l,x,y+20+k*17)})};drawWrap(q.n,cols[0]+4,30);drawWrap(q.text,cols[1]+4,398);drawWrap(a.score??'',cols[2]+4,55);drawWrap(a.comment||'',cols[3]+4,205);y+=rh});
 if(p===Math.ceil(rows.length/8)-1){let sy=y+24;txt(ctx,'Подписи по результатам проверки',55,sy,19,true);txt(ctx,'Инженер-химик: __________________________',55,sy+35,16);txt(ctx,'Мастер-технолог: _________________________',55,sy+65,16);txt(ctx,'Проверяемый (ФИО): ______________________',55,sy+95,16)} }));
 const photos=check.criteria.flatMap((q,j)=>(record.items[j]?.photos||[]).map(src=>({src,q,comment:record.items[j]?.comment||''})));
 photos.forEach((p,idx)=>{let img=null;let fn=(ctx,w,h)=>{let y=base(ctx,w,h,'Фотоматериалы',check.name,`Критерий № ${p.q.n} • ${d}`);txt(ctx,p.q.text,55,y+18,17,false,'#19364e',720);txt(ctx,'Фото привязано к указанному критерию. Содержание подтверждает проверяющий.',55,y+67,15,false,'#667b8e',730);if(img){let maxW=710,maxH=610,scale=Math.min(maxW/img.width,maxH/img.height);let dw=img.width*scale,dh=img.height*scale;ctx.drawImage(img,(w-dw)/2,y+85,dw,dh)}else txt(ctx,'Фотография недоступна для встраивания',55,y+90,21);if(p.comment)txt(ctx,'Комментарий: '+p.comment,55,h-95,16,false,'#19364e',720)};fn.prepare=()=>new Promise(resolve=>{let im=new Image();im.onload=()=>{img=im;resolve()};im.onerror=resolve;im.src=p.src;if(im.complete&&im.naturalWidth){img=im;resolve()}});slides.push(fn)});
 pdfBuild('ТДХ_Чеклист_'+d+'_'+(i+1),slides,true).catch(e=>alert('Ошибка PDF: '+e.message))}
